# Site settings
title: UseArazzo
email: info@usearazzo.com
tagline: The Foundational Operating System for Arazzo API Workflows
description: >-
  UseArazzo is a JavaScript/TypeScript toolkit for Arazzo, the OpenAPI Initiative's specification
  for multi-step API workflows. Validate documents, run workflows against live APIs, and read the
  trace of each step.
keywords: UseArazzo, Arazzo, Arazzo Specification, OpenAPI, API workflows, workflow automation, CLI, Runner, Validator, API tooling
baseurl: ""
url: "https://usearazzo.com"
github_username: usearazzo

# Build settings
markdown: kramdown
permalink: pretty
# No server-side syntax highlighting: Prism highlights in the browser, and Rouge's token spans
# (about 800 per docs page, 20 to 45 KB of HTML) were discarded by Prism anyway.
highlighter: none
kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  posts:
    output: true
    permalink: /blog/:title/
  tutorials:
    output: true
    permalink: /docs/tutorials/:title/
  guides:
    output: true
    permalink: /docs/guides/:title/
  reference:
    output: true
    permalink: /docs/:title/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # Link preview card (LinkedIn, Slack, X, Facebook). Blog posts override this
      # with their own hero image via front matter.
      image: /assets/images/social/og-default-2026-09.png
  - scope:
      path: ""
      type: posts
    values:
      prism: true
      layout: post
      author: "Vladimír Gorej"
      author_url: "https://vladimirgorej.com/"
      author_link: "/about/#vladimir-gorej"
  - scope:
      path: ""
      type: tutorials
    values:
      prism: true
      layout: tutorial
      author: "Vladimír Gorej"
      author_url: "https://vladimirgorej.com/"
      author_link: "/about/#vladimir-gorej"
  - scope:
      path: ""
      type: guides
    values:
      prism: true
      layout: guide
      author: "Vladimír Gorej"
      author_url: "https://vladimirgorej.com/"
      author_link: "/about/#vladimir-gorej"
  - scope:
      path: ""
      type: reference
    values:
      prism: true
      layout: reference

# Exclude from processing
exclude:
  - CLAUDE.md
  - tailwind.config.js
  - CONTRIBUTING.md
  - README.md
  - LICENSE
  - NOTICE
  - .gitignore
  - .idea
  - Gemfile
  - Gemfile.lock
  - vendor
